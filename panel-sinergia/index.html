<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Sinergia</title><style>:root{--i:#073e4b;--d:#063743;--y:#ffc83e;--c:#fbf8f2}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:15px system-ui,sans-serif}header{padding:22px 6vw;background:var(--d);color:#fff;display:flex;justify-content:space-between}header b{font:500 30px Georgia,serif}main{max-width:1400px;margin:auto;padding:36px 6vw}.box{background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #073e4b14}.login{max-width:520px;margin:10vh auto}input{width:100%;padding:13px;border:1px solid #ccd5d4;border-radius:12px;font:inherit;margin:7px 0}.btn{border:0;border-radius:999px;padding:13px 18px;background:var(--y);color:var(--i);font-weight:900;cursor:pointer}.err{color:#a33;font-weight:800;min-height:22px}.muted{opacity:.65}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.metric{background:#f1f6f4;padding:18px;border-radius:18px}.metric b{display:block;font:500 30px Georgia,serif;margin-top:4px}.tools{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 9px;border-bottom:1px solid #e5ebe8;text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em}.pill{background:#e7f3ef;border-radius:999px;padding:5px 8px;font-weight:800}@media(max-width:800px){main{padding:22px 5vw}.metrics{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}header b{font-size:24px}}</style></head><body><header><b>Panel Sinergia</b><span id="who"></span></header><main><section class="box login" id="login"><div class="muted">Acceso privado</div><h1>Gestión Sinergia</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button class="btn" id="go">Ingresar</button><div class="err" id="err"></div></section><section class="box" id="app" hidden><div class="metrics"><div class="metric">Contactos<b id="mc">—</b></div><div class="metric">Test iniciales<b id="mi">—</b></div><div class="metric">Digitales<b id="md">—</b></div><div class="metric">Oportunidades abiertas<b id="mo">—</b></div></div><div class="tools"><input id="search" placeholder="Buscar nombre, email o empresa"><button class="btn" id="refresh">Actualizar</button></div><div class="table"><table><thead><tr><th>Contacto</th><th>Empresa</th><th>Etapa</th><th>Diagnósticos</th><th>Comercial</th><th>Actualizado</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted" id="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const FN="https://ccxoadcldblgsuaywfwk.supabase.co/functions/v1/sinergia-panel-config";let sb;
const $=x=>document.getElementById(x),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function init(){const r=await fetch(FN);if(!r.ok)throw Error();const k=await r.json();sb=window.supabase.createClient(k.url,k.key);const s=await sb.auth.getSession();if(s.data.session)show(s.data.session.user)}
async function login(){ $("err").textContent="";const r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){$("err").textContent="No pudimos iniciar sesión.";return}show(r.data.user)}
async function show(u){$("login").hidden=true;$("app").hidden=false;$("who").textContent=u.email;await load()}
async function load(){const r=await sb.rpc("sinergia_panel_contactos_search",{p_busqueda:$("search").value.trim()||null});if(r.error){$("status").textContent="No se pudo cargar el panel.";return}const a=r.data||[];$("mc").textContent=a.length;$("mi").textContent=a.filter(x=>x.test_inicial_id).length;$("md").textContent=a.filter(x=>x.diagnostico_digital_id).length;$("mo").textContent=a.filter(x=>x.oportunidad_estado==="abierta").length;$("rows").innerHTML=a.map(x=>'<tr><td><b>'+esc((x.nombre||"")+" "+(x.apellido||""))+'</b><br><span class="muted">'+esc(x.email)+'</span></td><td>'+esc(x.empresa)+'</td><td><span class="pill">'+esc(x.etapa_comercial||"—")+'</span></td><td>'+(x.test_inicial_id?"Inicial ✓":"—")+'<br>'+(x.diagnostico_digital_id?"Digital · "+esc(x.diagnostico_digital_estado||""):"—")+'</td><td>'+[x.valor_diagnostico&&"Diag. $"+x.valor_diagnostico,x.bonificacion&&"Bonif. $"+x.bonificacion,x.valor_roadmap&&"Roadmap $"+x.valor_roadmap,x.valor_proyecto&&"Proyecto $"+x.valor_proyecto].filter(Boolean).join(" · ")||"—")+'</td><td>'+new Date(x.updated_at||x.created_at).toLocaleString("es-AR")+'</td></tr>').join("");$("status").textContent=a.length+" contacto(s)"}
$("go").onclick=login;$("refresh").onclick=load;$("search").onkeydown=e=>{if(e.key==="Enter")load()};init().catch(()=>{$("err").textContent="No se pudo preparar el acceso."});
</script></body></html>
